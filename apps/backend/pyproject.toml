[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "email-support-backend"
version = "0.1.1"
description = "Credential-free FastAPI foundation for Email Support."
requires-python = ">=3.13.17,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/email_support"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/contracts"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts", "tests", "migrations"]
show_error_codes = true
