name: Implementation task
description: Deliver a bounded technical change.
type: Task
projects: ["agent-bean/15"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the problem and the resulting behavior.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify affected modules, contracts, and material boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and the checks that prove them.
    validations:
      required: true
