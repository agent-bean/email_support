name: Implementation task
description: Deliver a bounded technical change.
type: Task
projects: ["agent-bean/15"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the problem and the resulting behavior.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Include only affected modules, contracts, and material boundaries; omit information already stored in GitHub fields.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Write only observable outcomes needed for completion, one unchecked checkbox per outcome.
      value: "- [ ] "
    validations:
      required: true
