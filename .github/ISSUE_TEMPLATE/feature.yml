name: Feature
description: Add a user-facing capability.
type: Feature
projects: ["agent-bean/15"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: Describe who needs this capability and the resulting behavior.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Include only material workflow, contract, and exclusion details; omit information already stored in GitHub fields.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Write only observable outcomes needed for completion, one unchecked checkbox per outcome.
      value: "- [ ] "
    validations:
      required: true
