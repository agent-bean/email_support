name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      EMAIL_SUPPORT_TEST_POSTGRES_PASSWORD: ci-test-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ci-test-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_USER: email_support_test_admin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready --username email_support_test_admin --dbname postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: apps/backend/.python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: make backend-setup
      - run: make backend-check
        env:
          EMAIL_SUPPORT_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}

  web:
    name: Web
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run test
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run format:check
      - run: npm --prefix apps/web run build

  api-contracts:
    name: API contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: apps/backend/.python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: make setup
      - run: make check-api-drift

  smoke:
    name: Smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose config --quiet
      - run: make up
      - run: npm --prefix apps/web run test:smoke
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: make down
